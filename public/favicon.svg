<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDFBA" />
      <stop offset="100%" stop-color="#FFB3BA" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7BDCB5" />
      <stop offset="100%" stop-color="#00D084" />
    </linearGradient>
    <filter id="cozyShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#805B50" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Bubbly rounded base -->
  <rect x="6" y="6" width="88" height="88" rx="28" fill="url(#bgGrad)" stroke="#6C4A3A" stroke-width="4.5" filter="url(#cozyShadow)" />

  <!-- Cute plant pot -->
  <path d="M30 60 L36 80 Q37 83 41 83 L59 83 Q63 83 64 80 L70 60 Z" fill="#FFE5D9" stroke="#6C4A3A" stroke-width="4" stroke-linejoin="round" />
  <rect x="26" y="54" width="48" height="10" rx="5" fill="#FFCCD5" stroke="#6C4A3A" stroke-width="4" />

  <!-- Cute Sprout Stems & Leaves -->
  <!-- Main stem -->
  <path d="M50 54 Q50 36 43 28" fill="none" stroke="#6C4A3A" stroke-width="4.5" stroke-linecap="round" />
  
  <!-- Left Sprout Leaf -->
  <path d="M48 42 C30 38 30 22 46 22 C48 30 46 38 48 42 Z" fill="url(#leafGrad)" stroke="#6C4A3A" stroke-width="3.5" stroke-linejoin="round" />
  
  <!-- Right Sprout Leaf -->
  <path d="M50 35 C68 31 68 15 52 15 C50 23 52 31 50 35 Z" fill="#BFFCC6" stroke="#6C4A3A" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Cute Pot Face: Eyes & Blush -->
  <circle cx="43" cy="71" r="2.5" fill="#6C4A3A" />
  <circle cx="57" cy="71" r="2.5" fill="#6C4A3A" />
  <path d="M48 74 Q50 77 52 74" fill="none" stroke="#6C4A3A" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="38" cy="74" r="3" fill="#FF9AA2" opacity="0.6" />
  <circle cx="62" cy="74" r="3" fill="#FF9AA2" opacity="0.6" />

  <!-- Star sparkle -->
  <path d="M72 26 Q74 29 77 30 Q74 31 72 34 Q71 31 68 30 Q71 29 72 26 Z" fill="#FFD166" stroke="#6C4A3A" stroke-width="2" />
</svg>